<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Item Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 500px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        .input-group { display: flex; gap: 10px; margin-top: 1.5rem; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; }
        .btn-logout { background-color: #6c757d; color: white; }
        ul { list-style: none; padding: 0; margin-top: 1.5rem; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Item Dashboard</h2>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>

        <div class="input-group">
            <input type="text" id="item-name" placeholder="Enter new item name">
            <button class="btn-add" onclick="addItem()">Add Item</button>
        </div>

        <ul id="item-list"></ul>
    </div>

    <script>
        // Redirect immediately if not logged in
        if (!localStorage.getItem("user_authenticated")) {
            window.location.href = '/login';
        }

        function handleLogout() {
            localStorage.removeItem("user_authenticated");
            window.location.href = '/login';
        }

        async function fetchItems() {
            const res = await fetch('/items');
            const items = await res.json();
            const list = document.getElementById('item-list');
            list.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${item.name}</span> <button class="btn-delete" onclick="deleteItem('${item._id}')">Delete</button>`;
                list.appendChild(li);
            });
        }

        async function addItem() {
            const input = document.getElementById('item-name');
            if (!input.value.trim()) return;
            await fetch('/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: input.value.trim() })
            });
            input.value = '';
            fetchItems();
        }

        async function deleteItem(id) {
            await fetch(`/items/${id}`, { method: 'DELETE' });
            fetchItems();
        }

        fetchItems();
    </script>
</body>
</html>
